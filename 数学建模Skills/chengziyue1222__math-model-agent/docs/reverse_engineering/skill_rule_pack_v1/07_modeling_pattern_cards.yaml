schema_version: '1.0'
rules:
- rule_id: MODEL-PATTERN-001
  description: 算法模式卡：共用内核与依赖图
  source_files:
  - 国赛24年Aclaudeopus5直出(1).pdf
  - 24Afable5直出(1).pdf
  evidence_pages:
  - A pp.6-15
  - B pp.6-11
  confidence: high
  mandatory: false
  scope: modeling_pattern
  implementation_target:
  - SKILL.md
  - config
  - documentation
  - tests
  validation_method: 按卡片的 required_validation 自动生成并执行；任一强制验证失败则该模式不得输出“已验证”。
  rule_origin: direct_observation
  priority: P0
  method_name: 共用内核与依赖图
  problem_type: 多子问题共享状态/约束/工具
  trigger_conditions:
  - 至少两个子问题复用同一状态或判据
  inputs:
  - 题目结构
  - 子问题输入输出
  outputs:
  - 依赖图
  - 统一接口
  preconditions:
  - 复用逻辑可抽象且口径一致
  recommended_algorithm: 先建依赖 DAG，再定义共用接口
  alternative_algorithm: 每问独立实现
  major_failure_modes:
  - 重复代码导致口径漂移
  - 局部修改不一致
  required_validation:
  - 接口合同测试
  - 跨问题同源判据测试
  recommended_figures:
  - 总体技术路线图
  transferable_tasks:
  - 多阶段预测
  - 优化-仿真联动
  - 供应链/交通/排队
