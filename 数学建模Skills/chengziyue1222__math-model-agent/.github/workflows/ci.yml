name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import algorithms; print(f'algorithms exports: {len(algorithms.__all__)}')"

      - name: Validate Codex Skills
        run: python scripts/validate_skills.py

      - name: Validate public repository facts
        run: python scripts/validate_repository_facts.py

      - name: Validate historical benchmark catalog
        run: python scripts/validate_benchmarks.py

      - name: Validate legacy compatibility archive
        run: python scripts/validate_legacy_archive.py

      - name: Run Ruff
        run: python -m ruff check code skills scripts

      - name: Run tests with coverage
        run: |
          # pytest creates the final basetemp directory, but not its parent.
          mkdir -p .test-tmp/pytest
          python -m pytest code/tests -v --tb=short \
            --cov=algorithms --cov-report=term-missing --cov-report=xml \
            --cov-report=json:coverage.json
          python scripts/check_coverage.py coverage.json

      - name: Run end-to-end figure generation
        run: python -m pytest code/tests/test_visualize.py -q

      - name: Build source and wheel distributions
        run: python -m build
