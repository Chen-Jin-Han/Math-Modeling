[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-model-agent"
version = "7.3.0"
description = "Mathematical-modeling algorithm library used by the Math Model Agent repository"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "networkx>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rarfile>=4.5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    # Provides the ``fitz`` module used by the PDF-layout validation tests.
    "PyMuPDF>=1.24.0",
    "ruff>=0.12",
    "httpx2>=2.12",
]

# Only ``algorithms`` is distributed as an importable package, matching the
# installation contract documented in README.md. The ``nova_*`` applications run
# from this repository (see ``start_api.sh`` and ``demo/run_demo.py``) and depend
# on the repository-level ``scripts`` package, so they cannot work from an
# installed wheel.
[tool.setuptools.packages.find]
where = ["code"]
include = ["algorithms*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code", "."]
# Keep pytest out of a potentially access-controlled system temp directory.
# This directory is dedicated to pytest and is ignored by Git.
addopts = "--basetemp=.test-tmp/pytest"

[tool.coverage.report]
exclude_also = [
    "def example\\(",
    "def _demo\\(",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"code/algorithms/__init__.py" = ["F401"]
